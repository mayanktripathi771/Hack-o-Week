<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hack-O-Week | Electricity Peak Prediction</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f4f4; margin:0; }
        .container { max-width:960px; margin:2rem auto; padding:1rem; }
        h1 { margin-bottom:0.25rem; }
        p.lead { margin-top:0; color:#555; }
        #graph { width:100%; height:600px; }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="text-align:center;">Peak Hour Electricity Spikes</h1>
        <p class="lead" style="text-align:center;">
            Hack-O-Week Project – Predicting evening electricity peaks using data analytics
        </p>

        <div id="graph" role="img" aria-label="Electricity peak prediction chart"></div>
        
        <!-- Insert graph data as application/json to avoid JS parser issues -->
        <script id="graph-data" type="application/json">{{ graphJSON | safe }}</script>

        <script>
            (function() {
                try {
                    var graphData = null;
                    var graphDataEl = document.getElementById('graph-data');
                    if (graphDataEl && graphDataEl.textContent) {
                        graphData = JSON.parse(graphDataEl.textContent);
                    }

                    if (!graphData) {
                        throw new Error('No graph data found');
                    }

                    // Allow graphData to be either the full {data, layout} object or just the data array
                    var data = graphData.data || graphData;
                    var layout = graphData.layout || {};

                    Plotly.newPlot('graph', data, layout);
                } catch (err) {
                    var el = document.getElementById('graph');
                    if (el) {
                        el.innerHTML = '<p style="color:#900;">Error rendering chart: ' + (err.message || err) + '</p>';
                    }
                    console.error('Plotly render error:', err);
                }
            })();
        </script>

    </div>

</body>
</html>
